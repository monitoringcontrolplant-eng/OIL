<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oil Monitoring System - Pro Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Export/Import -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 p-2.5 rounded-xl text-slate-950 font-bold shadow-md">
                    <i class="fa-solid fa-oil-can text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-white">OIL MONITORING PRO</h1>
                    <p class="text-xs text-slate-400">Management Cloud System & Spreadsheet Sync</p>
                </div>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="refreshData()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3.5 py-2 rounded-lg font-medium border border-slate-600 transition flex items-center gap-2 text-slate-200">
                    <i class="fa-solid fa-rotate text-blue-400" id="refresh-icon"></i> Refresh Data
                </button>
                <button onclick="clearSystemCache()" class="bg-rose-950/80 hover:bg-rose-900 text-xs px-3.5 py-2 rounded-lg font-medium border border-rose-800 transition flex items-center gap-2 text-rose-200">
                    <i class="fa-solid fa-trash-can"></i> Reset Cache
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3.5 py-2 rounded-lg font-medium text-white transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-file-excel"></i> Export Excel
                </button>
                <label class="bg-blue-600 hover:bg-blue-500 text-xs px-3.5 py-2 rounded-lg font-medium text-white transition flex items-center gap-2 cursor-pointer shadow-sm">
                    <i class="fa-solid fa-file-arrow-up"></i> Import Excel
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="importExcel(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Notification Banner -->
        <div id="alert-box" class="hidden p-4 rounded-xl text-sm font-medium shadow-md transition-all duration-300"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Form Input Panel -->
            <div class="lg:col-span-1 bg-slate-800 p-5 rounded-2xl shadow-xl border border-slate-700">
                <h2 class="text-base font-bold text-white mb-4 pb-2 border-b border-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i> Form Input Transaksi Oil
                </h2>
                
                <form id="oilForm" onsubmit="handleSubmit(event)" class="space-y-3.5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Site (ID)</label>
                        <input type="text" id="site" required placeholder="Contoh: BAYAN, SITE A" class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Code Unit</label>
                        <input type="text" id="kodeUnit" required placeholder="Contoh: DT-01, EX-05" class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Tanggal</label>
                            <input type="date" id="tanggal" required class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Jumlah (Liter)</label>
                            <input type="number" step="0.01" id="jumlah" required placeholder="0.00" class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Jenis Oil</label>
                            <input type="text" id="jenisOil" required placeholder="Hydraulic, Engine..." class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Typre Oil</label>
                            <input type="text" id="typeOil" required placeholder="15W-40, ISO VG 46..." class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Component</label>
                        <input type="text" id="component" required placeholder="Engine, Transmission..." class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Jenis Pengisian</label>
                            <select id="jenisPengisian" required class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Pilih...</option>
                                <option value="Top Up">Top Up</option>
                                <option value="Refill">Refill</option>
                                <option value="Change">Change</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-300 mb-1">Shift</label>
                            <select id="shift" required class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">Pilih...</option>
                                <option value="Shift 1">Shift 1</option>
                                <option value="Shift 2">Shift 2</option>
                                <option value="Shift 3">Shift 3</option>
                                <option value="Non-Shift">Non-Shift</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Station</label>
                        <input type="text" id="station" required placeholder="Contoh: LS02" class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Manpower</label>
                        <input type="text" id="manpower" required placeholder="Nama Teknisi" class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Problem</label>
                        <textarea id="problem" rows="2" placeholder="Keterangan / Kendala" class="w-full text-sm bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan Data
                    </button>
                </form>
            </div>

            <!-- Data Table & Filter Panel -->
            <div class="lg:col-span-2 flex flex-col gap-4">
                
                <!-- Filter Section -->
                <div class="bg-slate-800 p-4 rounded-2xl shadow-xl border border-slate-700 flex flex-wrap gap-3 items-end">
                    <div class="flex-1 min-w-[140px]">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Filter Site</label>
                        <input type="text" id="filterSite" placeholder="Cari site..." oninput="filterData()" class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="w-[130px]">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Dari Tanggal</label>
                        <input type="date" id="filterStartDate" onchange="filterData()" class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2.5 text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="w-[130px]">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Sampai Tanggal</label>
                        <input type="date" id="filterEndDate" onchange="filterData()" class="w-full text-xs bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2.5 text-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <button onclick="resetFilter()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3.5 py-2.5 rounded-xl font-medium transition">
                            <i class="fa-solid fa-filter-circle-xmark"></i> Reset
                        </button>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="bg-slate-800 rounded-2xl shadow-xl border border-slate-700 flex-grow flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/80">
                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-table-list text-blue-400"></i> Rekap Data Sheet Transaction
                        </h3>
                        <span id="dataCount" class="text-xs bg-blue-950 text-blue-300 border border-blue-800 font-semibold px-3 py-1 rounded-full">0 Data</span>
                    </div>

                    <div class="overflow-x-auto flex-grow max-h-[580px]">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-900 text-slate-300 sticky top-0 z-10 border-b border-slate-700">
                                <tr>
                                    <th class="p-3 font-semibold">ID (Site)</th>
                                    <th class="p-3 font-semibold">Code Unit</th>
                                    <th class="p-3 font-semibold">Tanggal</th>
                                    <th class="p-3 font-semibold">Jumlah</th>
                                    <th class="p-3 font-semibold">Jenis Oil</th>
                                    <th class="p-3 font-semibold">Typre Oil</th>
                                    <th class="p-3 font-semibold">Component</th>
                                    <th class="p-3 font-semibold">Pengisian</th>
                                    <th class="p-3 font-semibold">Shift</th>
                                    <th class="p-3 font-semibold">Station</th>
                                    <th class="p-3 font-semibold">Manpower</th>
                                    <th class="p-3 font-semibold">Problem</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-700/50">
                                <!-- Data rows inserted dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-3 text-center text-xs text-slate-400 mt-6">
        Oil Monitoring Pro System &copy; 2026
    </footer>

    <!-- Script Logic -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyIcur1LWkK3t1cpkqc3BRtwUdVMAtowcLfHPqH9-op4XzOrY7YFWvoCQD230Aunt6j6w/exec";
        let allData = [];

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("tanggal").valueAsDate = new Date();
            loadLocalData();
            refreshData();
        });

        function loadLocalData() {
            const saved = localStorage.getItem("oil_monitoring_pro_v1");
            if (saved) {
                try {
                    allData = JSON.parse(saved);
                    renderTable(allData);
                } catch (e) {
                    console.error("Local data error", e);
                }
            }
        }

        function saveLocalData() {
            localStorage.setItem("oil_monitoring_pro_v1", JSON.stringify(allData));
        }

        function clearSystemCache() {
            if (confirm("Reset seluruh cache lokal dan muat ulang bersih dari Google Spreadsheet?")) {
                localStorage.removeItem("oil_monitoring_pro_v1");
                localStorage.clear();
                showAlert("Cache dibersihkan. Memuat ulang...", "success");
                setTimeout(() => location.reload(), 1000);
            }
        }

        function showAlert(message, type = "success") {
            const alertBox = document.getElementById("alert-box");
            alertBox.className = `p-4 rounded-xl text-sm font-medium shadow-md transition-all duration-300 ${
                type === "success" 
                    ? "bg-emerald-950 text-emerald-200 border border-emerald-800" 
                    : "bg-rose-950 text-rose-200 border border-rose-800"
            }`;
            alertBox.innerHTML = `<div class="flex items-center gap-2"><i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : 'fa-triangle-exclamation text-rose-400'}"></i> ${message}</div>`;
            alertBox.classList.remove("hidden");
            setTimeout(() => alertBox.classList.add("hidden"), 4000);
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

            const newData = {
                site: document.getElementById("site").value.trim(),
                kodeUnit: document.getElementById("kodeUnit").value.trim(),
                tanggal: document.getElementById("tanggal").value,
                jumlah: document.getElementById("jumlah").value,
                jenisOil: document.getElementById("jenisOil").value.trim(),
                typeOil: document.getElementById("typeOil").value.trim(),
                component: document.getElementById("component").value.trim(),
                jenisPengisian: document.getElementById("jenisPengisian").value,
                shift: document.getElementById("shift").value,
                station: document.getElementById("station").value.trim(),
                manpower: document.getElementById("manpower").value.trim(),
                problem: document.getElementById("problem").value.trim() || "-"
            };

            allData.unshift(newData);
            saveLocalData();
            renderTable(allData);

            try {
                await fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(newData)
                });
                showAlert("Data berhasil disimpan ke Spreadsheet & Sistem!");
                document.getElementById("oilForm").reset();
                document.getElementById("tanggal").valueAsDate = new Date();
            } catch (error) {
                console.error(error);
                showAlert("Tersimpan lokal, gagal mengirim ke cloud spreadsheet.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan Data`;
            }
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById("tableBody");
            document.getElementById("dataCount").innerText = `${dataArray.length} Data`;
            
            if (dataArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" class="text-center py-8 text-slate-500 italic">Belum ada data transaksi oil.</td></tr>`;
                return;
            }

            tbody.innerHTML = dataArray.map(item => {
                // Penanganan fleksibel untuk mendeteksi berbagai variasi penamaan properti code unit dari server/local
                const displayKodeUnit = item.kodeUnit || item.kode_unit || item["CODE UNIT"] || item["Kode Unit"] || "-";
                const displaySite = item.site || item.ID || item.id || "-";
                const displayTanggal = item.tanggal || item.TANGGAL || "-";
                const displayJumlah = item.jumlah || item.JUMLAH || 0;
                const displayJenisOil = item.jenisOil || item["JENIS OIL"] || "-";
                const displayTypeOil = item.typeOil || item["TYPRE OIL"] || "-";
                const displayComponent = item.component || item.COMPONENT || "-";
                const displayPengisian = item.jenisPengisian || item["JENIS PENGISIAN"] || "-";
                const displayShift = item.shift || item.SHIFT || "-";
                const displayStation = item.station || item.STATION || "-";
                const displayManpower = item.manpower || item.MANPOWER || "-";
                const displayProblem = item.problem || item.PROBLEM || "-";

                return `
                <tr class="hover:bg-slate-700/40 transition">
                    <td class="p-3 font-semibold text-white">${escapeHtml(displaySite)}</td>
                    <td class="p-3 font-bold text-blue-400">${escapeHtml(displayKodeUnit)}</td>
                    <td class="p-3 text-slate-300">${escapeHtml(displayTanggal)}</td>
                    <td class="p-3 font-semibold text-emerald-400">${escapeHtml(displayJumlah)} L</td>
                    <td class="p-3 text-slate-300">${escapeHtml(displayJenisOil)}</td>
                    <td class="p-3 text-slate-300">${escapeHtml(displayTypeOil)}</td>
                    <td class="p-3 text-slate-300">${escapeHtml(displayComponent)}</td>
                    <td class="p-3">
                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${
                            displayPengisian === 'Top Up' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                            displayPengisian === 'Refill' ? 'bg-blue-950 text-blue-300 border border-blue-800' : 'bg-purple-950 text-purple-300 border border-purple-800'
                        }">${escapeHtml(displayPengisian)}</span>
                    </td>
                    <td class="p-3 text-slate-300">${escapeHtml(displayShift)}</td>
                    <td class="p-3 text-slate-300">${escapeHtml(displayStation)}</td>
                    <td class="p-3 text-slate-200 font-medium">${escapeHtml(displayManpower)}</td>
                    <td class="p-3 text-slate-400 italic">${escapeHtml(displayProblem)}</td>
                </tr>`;
            }).join("");
        }

        async function refreshData() {
            const icon = document.getElementById("refresh-icon");
            icon.classList.add("fa-spin");

            try {
                const response = await fetch(WEB_APP_URL);
                const result = await response.json();
                if (Array.isArray(result) && result.length > 0) {
                    allData = result;
                    saveLocalData();
                    renderTable(allData);
                    showAlert("Data tersinkronisasi dari Google Spreadsheet!");
                }
            } catch (error) {
                console.warn("Menggunakan data lokal.", error);
            } finally {
                icon.classList.remove("fa-spin");
            }
        }

        function filterData() {
            const siteQuery = document.getElementById("filterSite").value.toLowerCase();
            const startDate = document.getElementById("filterStartDate").value;
            const endDate = document.getElementById("filterEndDate").value;

            const filtered = allData.filter(item => {
                const siteVal = (item.site || item.ID || "").toLowerCase();
                const matchSite = siteVal.includes(siteQuery);
                const tgl = item.tanggal || item.TANGGAL || "";
                const matchStart = startDate ? tgl >= startDate : true;
                const matchEnd = endDate ? tgl <= endDate : true;
                return matchSite && matchStart && matchEnd;
            });
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById("filterSite").value = "";
            document.getElementById("filterStartDate").value = "";
            document.getElementById("filterEndDate").value = "";
            renderTable(allData);
        }

        function exportToExcel() {
            if (allData.length === 0) {
                showAlert("Tidak ada data untuk diexport!", "error");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(allData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Transaction");
            XLSX.writeFile(workbook, "Oil_Monitoring_Report.xlsx");
            showAlert("File Excel berhasil diunduh!");
        }

        function importExcel(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json.length > 0) {
                        const imported = json.map(row => ({
                            site: row.ID || row.Site || row.site || "-",
                            kodeUnit: row["CODE UNIT"] || row["Kode Unit"] || row.kodeUnit || row.kode_unit || "-",
                            tanggal: row.TANGGAL || row.Tanggal || row.tanggal || new Date().toISOString().split('T')[0],
                            jumlah: row.JUMLAH || row.Jumlah || row.jumlah || 0,
                            jenisOil: row["JENIS OIL"] || row["Jenis Oil"] || row.jenisOil || "-",
                            typeOil: row["TYPRE OIL"] || row["Type Oil"] || row.typeOil || "-",
                            component: row.COMPONENT || row.Component || row.component || "-",
                            jenisPengisian: row["JENIS PENGISIAN"] || row["Jenis Pengisian"] || row.jenisPengisian || "Top Up",
                            shift: row.SHIFT || row.Shift || row.shift || "Shift 1",
                            station: row.STATION || row.Station || row.station || "-",
                            manpower: row.MANPOWER || row.Manpower || row.manpower || "-",
                            problem: row.PROBLEM || row.Problem || row.problem || "-"
                        }));

                        allData = [...imported, ...allData];
                        saveLocalData();
                        renderTable(allData);
                        showAlert(`Berhasil mengimpor ${imported.length} baris data Excel!`);
                    }
                } catch (err) {
                    console.error(err);
                    showAlert("Gagal membaca file Excel.", "error");
                }
                e.target.value = "";
            };
            reader.readAsArrayBuffer(file);
        }

        function escapeHtml(text) {
            if (!text) return "";
            return text.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
